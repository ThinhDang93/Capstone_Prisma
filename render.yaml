services:
  - type: web
    name: capstone-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false 
      - key: JWT_SECRET
        sync: false 
      - key: JWT_EXPIRES_IN
        value: 1d
